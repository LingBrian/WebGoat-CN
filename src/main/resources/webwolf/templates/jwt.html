<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{fragments/header :: header-css}"/>
</head>
<body>

<div th:replace="~{fragments/header :: header}"/>

<script type="text/javascript" th:src="@{/js/jwt.js}"></script>


<div class="container mt-3">

    <div class="alert alert-info alert-dismissible fade show">
        <div>
        <p>
            <span th:text="#{webwolf.jwt.instruction}">Decode or encode a JWT some of the exercises need to encode or decode a new token</span>
        </p>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" th:attr="aria-label=#{webwolf.upload.close}" aria-label="Close"></button>
    </div>

    <div class="panel-group" id="accordion" role="tablist" aria-multiselectable="true">
        <div class="form-group">
            <label for="token"><strong th:text="#{webwolf.jwt.encoded}">Encoded</strong></label>
            <form id="decodeForm">
            <textarea class="form-control" style="font-size: 14pt; font-family:monospace;" id="token" name="token"
                      rows="4"
                      th:placeholder="#{webwolf.jwt.paste}" placeholder="Paste token here" spellcheck="false"></textarea>
            </form>
        </div>
        <form id="encodeForm">
            <div class="form-group mt-2">
                <label><strong th:text="#{webwolf.jwt.decoded}">Decoded</strong></label>
                <div class="row">
                    <div class="col-xs-6 col-md-5" th:text="#{webwolf.jwt.header}">Header</div>
                    <div class="col-xs-6 col-md-7" th:text="#{webwolf.jwt.payload}">Payload</div>
                </div>
                <div class="row">
                    <div class="col-xs-6 col-md-5">
                    <textarea class="form-control" style="font-size: 14pt; font-family:monospace;" id="header"
                              name="header"
                              rows="12"></textarea>
                    </div>
                    <div class="col-xs-6 col-md-7">
                    <textarea class="form-control" style="font-size: 14pt; font-family:monospace;" id="payload"
                              name="payload"
                              rows="12"></textarea>
                    </div>
                </div>
            </div>
        </form>

        <div class="mt-3">
            <label class="form-label"><strong th:text="#{webwolf.jwt.signature}">Signature verification</strong></label>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="verificationMode" id="verificationSecret" value="secret" checked>
                <label class="form-check-label" for="verificationSecret" th:text="#{webwolf.jwt.shared.secret}">Shared secret (HMAC)</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="verificationMode" id="verificationJwks" value="jwks">
                <label class="form-check-label" for="verificationJwks" th:text="#{webwolf.jwt.jwks}">JWKS (public keys)</label>
            </div>
        </div>

        <div id="secretKeySection" class="input-group input-group-sm mb-3 mt-3">
            <span class="input-group-text" id="inputGroup-sizing-sm" th:text="#{webwolf.jwt.secret.key}">Secret key</span>
            <input type="text" class="form-control" id="secretKey" th:placeholder="#{webwolf.jwt.secret.placeholder}" placeholder="Enter your secret key" aria-describedby="inputGroup-sizing-sm">
        </div>

        <div id="jwksSection" class="mt-3 d-none">
            <label for="jwks" class="form-label" th:text="#{webwolf.jwt.jwks.json}">JWKS JSON</label>
            <textarea class="form-control" id="jwks" name="jwks" rows="6" style="font-family: monospace;" placeholder='{"keys":[...]}' spellcheck="false"></textarea>
            <small class="text-muted" th:text="#{webwolf.jwt.jwks.help}">Paste the JWKS (public keys) used to verify RS/ES signed tokens.</small>
        </div>

        <div class="input-group mt-3">
            <div class="spinner-border text-secondary me-2 d-none" id="signatureSpinner" role="status">
                <span class="visually-hidden" th:text="#{webwolf.jwt.loading}">Loading...</span>
            </div>
            <h4 id="signatureValid" th:text="#{webwolf.jwt.not.validated}"
                th:attr="data-valid=#{webwolf.jwt.valid},data-invalid=#{webwolf.jwt.invalid},data-not-validated=#{webwolf.jwt.not.validated}">Signature not validated</h4>
        </div>


    </div>


</div>
</body>
</html>
