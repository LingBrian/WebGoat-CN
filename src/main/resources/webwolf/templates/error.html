<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>WebWolf</title>
    <div th:replace="~{fragments/header :: header-css}"/>
</head>
<body>


<div th:replace="~{fragments/header :: header}"/>

<div class="container">

		<h1>WebWolf</h1>
		<p th:text="#{webwolf.error.description}">This is the general error page of WebWolf. It applies for all 404, 500 etc messages.</p>
		<p th:text="#{webwolf.error.redirect}">Sometimes you will end up on this page on purpose because of a fake call to WebGoat which is redirected to WebWolf. Login to WebWolf and check the incoming requests.</p>

		<br/>

		<table>
    <tr>
        <td th:text="#{webwolf.error.date}">Date:</td>
        <td th:text="${timestamp}"/>
    </tr>
    <tr>
        <td th:text="#{webwolf.error.path}">Path:</td>
        <td th:text="${path}"/>
    </tr>
    <tr>
        <td th:text="#{webwolf.error.status}">Status:</td>
        <td th:text="${status}"/>
    </tr>
</table>
	</div>
<!-- /.container -->

<div th:replace="~{fragments/footer :: footer}"/>

</body>
</html>
